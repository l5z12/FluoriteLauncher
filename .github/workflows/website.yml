name: Website

# Builds website/ on every change to it, and deploys pushes to main to Cloudflare (fluorite.l5z12.dev).
# The privacy and terms pages render PRIVACY.md and TERMS.md, and the pages use the app's logo assets.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - PRIVACY.md
      - TERMS.md
      - src/Fluorite.App/Assets/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - PRIVACY.md
      - TERMS.md
      - src/Fluorite.App/Assets/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, build and deploy together, so runs on main deploy in push order and an older commit
# can't overwrite a newer one. A newer run replaces any run still waiting, so main's latest commit always deploys
# last. A main run is never cancelled halfway through a deploy; a pull request's newer push cancels its older build.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version in website/package.json (packageManager).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://fluorite.l5z12.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Deploy exactly what the build job built.
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: website/dist/

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
